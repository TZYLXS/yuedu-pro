name: signing-probe

on:
  push:
    branches:
      - release/3.1.4.1
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Check secret presence only
        env:
          S1: ${{ secrets.RELEASE_KEY_STORE }}
          S2: ${{ secrets.KEYSTORE_BASE64 }}
          S3: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
          S4: ${{ secrets.YUEDU_KEYSTORE_BASE64 }}
          S5: ${{ secrets.RELEASE_STORE_BASE64 }}
        run: |
          found=0
          for n in RELEASE_KEY_STORE KEYSTORE_BASE64 SIGNING_KEYSTORE_BASE64 YUEDU_KEYSTORE_BASE64 RELEASE_STORE_BASE64; do
            eval v=\${$n}
            if [ -n "$v" ]; then
              echo "$n: PRESENT"
              found=1
            else
              echo "$n: MISSING"
            fi
          done
          if [ "$found" -eq 0 ]; then
            echo "NO_SIGNING_SECRET"
            exit 1
          fi
          echo "HAS_SIGNING_SECRET"
