plugins {
    id "com.android.application"
    id 'org.jetbrains.kotlin.android'
    id 'kotlin-parcelize'
    //id 'kotlin-kapt'
    id 'com.google.devtools.ksp'
}

static def releaseTime() {
    return new Date().format("yy.MMddHH", TimeZone.getTimeZone("GMT+8"))
}

// 阅读Pro：面向 Android 7.0+（API 24+），分 armv7 / arm64 两个产物
def appName = "yuedu_pro"
def version = "1.0." + releaseTime()
// 通过 -PtargetAbi=armv7 / arm64 切换产物；不传则两个 ABI 都打（约 2 倍体积）
def targetAbi = (project.findProperty("targetAbi") ?: "all").toString()
def abiFilterList
def abiSuffix
switch (targetAbi) {
    case "armv7":
        abiFilterList = ["armeabi-v7a"]
        abiSuffix = "-armv7"
        break
    case "arm64":
        abiFilterList = ["arm64-v8a"]
        abiSuffix = "-arm64"
        break
    default:
        abiFilterList = ["armeabi-v7a", "arm64-v8a"]
        abiSuffix = ""
}

android {
    compileSdk = compile_sdk_version
    namespace 'io.legado.app'
    kotlin {
        jvmToolchain {
            languageVersion.set(JavaLanguageVersion.of(17))
        }
    }

    signingConfigs {
        // 固定本地 keystore；Android 7.0+ 靠 v2 校验，v1 一并保留给部分国产安装器
        yuedu {
            storeFile rootProject.file("keystore/yuedu.jks")
            storePassword "yuedu2026"
            keyAlias "yuedu"
            keyPassword "yuedu2026"
            v1SigningEnabled true
            v2SigningEnabled true
            enableV3Signing = false
            enableV4Signing = false
        }
    }
    defaultConfig {
        // 独立包名：可与「阅读（API19 版）」共存安装
        applicationId "io.legado.pro"
        minSdk 24
        targetSdk 33
        versionCode 24004
        versionName version
        multiDexEnabled true
        ndk {
            // 由 -PtargetAbi 决定：armv7 或 arm64
            abiFilters.addAll(abiFilterList)
        }
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        project.ext.set("archivesBaseName", appName + "_" + version)

        buildConfigField "String", "Cronet_Version", "\"$CronetVersion\""
        buildConfigField "String", "Cronet_Main_Version", "\"$CronetMainVersion\""

        javaCompileOptions {
            annotationProcessorOptions {
                arguments += [
                        "room.incremental"     : "true",
                        "room.expandProjection": "true",
                        "room.schemaLocation"  : "$projectDir/schemas".toString()
                ]
            }
        }
    }
    buildFeatures {
        buildConfig true
        viewBinding true
    }
    buildTypes {
        release {
            signingConfig signingConfigs.yuedu
            // API19 移植版：先不做混淆/资源压缩，降低 4.4 上的运行时风险
            minifyEnabled false
            shrinkResources false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            signingConfig signingConfigs.yuedu
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    //noinspection GrDeprecatedAPIUsage
    flavorDimensions = ['mode']
    productFlavors {
        app {
            dimension "mode"
            manifestPlaceholders.put("APP_CHANNEL_VALUE", "app")
        }
    }

    android.applicationVariants.configureEach { variant ->
        variant.outputs.configureEach {
            def flavor = variant.productFlavors[0].name
            outputFileName = "${appName}_${flavor}_${defaultConfig.versionName}${abiSuffix}.apk"
        }
    }

    // 设定Room的KSP参数
    ksp {
        arg("room.incremental", "true")
        arg("room.expandProjection", "true")
        arg("room.schemaLocation", "$projectDir/schemas")

    }

    compileOptions {
        // Flag to enable support for the new language APIs
        coreLibraryDesugaringEnabled true
        // Sets Java compatibility
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    packaging {
        resources.excludes.add('META-INF/*')
    }

    sourceSets {
        // Adds exported schema location as test app assets.
        androidTest.assets.srcDirs += files("$projectDir/schemas".toString())
    }
    lint {
        checkDependencies true
        // API19 移植版：NewApi 只作报告，不阻断构建（逐条用 lint 报告修）
        abortOnError false
        checkReleaseBuilds false
    }
    tasks.withType(JavaCompile).tap {
        configureEach {
            //options.compilerArgs << "-Xlint:unchecked"
        }
    }
}

dependencies {
    compileOnly "com.android.tools.build:gradle:$agp_version"
    //noinspection GradleDependency,GradlePackageUpdate
    coreLibraryDesugaring('com.android.tools:desugar_jdk_libs_nio:2.0.3')
    testImplementation('junit:junit:4.13.2')
    androidTestImplementation('androidx.test:runner:1.5.2')
    androidTestImplementation('androidx.test.ext:junit:1.1.5')
    androidTestImplementation('androidx.test.espresso:espresso-core:3.5.1')
    //kotlin
    //noinspection GradleDependency,DifferentStdlibGradleVersion
    implementation("org.jetbrains.kotlin:kotlin-stdlib-jdk8:$kotlin_version")
    //Kotlin反射
    //noinspection GradleDependency,DifferentStdlibGradleVersion
    implementation("org.jetbrains.kotlin:kotlin-reflect:$kotlin_version")
    //协程
    def coroutines_version = '1.7.3'
    implementation("org.jetbrains.kotlinx:kotlinx-coroutines-core:$coroutines_version")
    implementation("org.jetbrains.kotlinx:kotlinx-coroutines-android:$coroutines_version")

    //图像处理库Toolkit
    implementation('com.github.android:renderscript-intrinsics-replacement-toolkit:b6363490c3')

    //androidX
    implementation('androidx.core:core-ktx:1.12.0')
    implementation('androidx.appcompat:appcompat:1.6.1')
    implementation('androidx.activity:activity-ktx:1.8.0')
    implementation('androidx.fragment:fragment-ktx:1.6.1')
    implementation('androidx.preference:preference-ktx:1.2.1')
    implementation('androidx.constraintlayout:constraintlayout:2.1.4')
    implementation('androidx.swiperefreshlayout:swiperefreshlayout:1.1.0')
    implementation('androidx.viewpager2:viewpager2:1.0.0')
    implementation('androidx.webkit:webkit:1.8.0')

